name: Deploy

# Builds with Ruby and publishes _out/ straight to GitHub Pages via the
# native Pages deployment (no gh-pages branch, no rsync/SSH). Runs on every
# push to main, plus manual dispatch for re-deploys with no content change.
#
# One-time repo setup (Settings → Pages) needed before this can go live:
# Source = "GitHub Actions". The custom domain (leepickupceramics.com) is
# set via a CNAME file written into _out/ by build.rb, not the dashboard
# field, so it survives even if Pages settings ever get reset.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec ruby build.rb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
